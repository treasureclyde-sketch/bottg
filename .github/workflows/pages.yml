name: Deploy sites to GitHub Pages

on:
  push:
    branches: [claude/install-mcp-servers-lh9cd6]
    paths:
      - "a-frame-village/**"
      - "volna-city/**"
      - "borisov/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site (A-Frame at root, ВолнаСити under /volna, Borisov under /borisov)
        run: |
          mkdir -p _site
          cp -r a-frame-village/. _site/
          mkdir -p _site/volna
          cp -r volna-city/. _site/volna/
          mkdir -p _site/borisov
          cp -r borisov/. _site/borisov/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
