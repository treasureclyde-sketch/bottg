<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Барбер-Лиды</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap');
  :root{
    --bg-deep:#020203;--bg:#08080C;--card:#101218;--card-2:#161922;
    --surface:rgba(255,255,255,.05);--surface-2:rgba(255,255,255,.08);
    --border:rgba(255,255,255,.09);--border-2:rgba(255,255,255,.14);
    --fg:#ECEDF1;--sub:#8A8F9C;
    --accent:#5E6AD2;--accent-2:#7C84E8;--accent-glow:rgba(94,106,210,.45);
    --like:#2BD576;--nope:#FF5C7A;--star:#FFC53D;
    --ease:cubic-bezier(.16,1,.3,1);
    --shadow:0 10px 30px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.05) inset;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg-deep);color:var(--fg);line-height:1.5;
    max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;overflow:hidden;position:relative}
  button{font-family:inherit;cursor:pointer}svg{display:block}
  .poppins{font-family:'Poppins',sans-serif}

  #aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(120% 80% at 50% -10%,#0d0f17 0%,var(--bg-deep) 60%)}
  .blob{position:absolute;border-radius:50%;filter:blur(64px);opacity:.5;will-change:transform}
  .b1{width:60vw;height:60vw;max-width:440px;max-height:440px;top:-12%;left:-18%;background:radial-gradient(circle,rgba(94,106,210,.7),transparent 70%);animation:flo1 19s var(--ease) infinite alternate}
  .b2{width:50vw;height:50vw;max-width:380px;max-height:380px;top:-6%;right:-18%;background:radial-gradient(circle,rgba(124,90,232,.5),transparent 70%);animation:flo2 23s var(--ease) infinite alternate}
  .b3{width:60vw;height:60vw;max-width:440px;max-height:440px;bottom:-20%;left:-8%;background:radial-gradient(circle,rgba(43,213,118,.16),transparent 70%);animation:flo3 27s var(--ease) infinite alternate}
  @keyframes flo1{to{transform:translate(40px,60px) scale(1.15)}}
  @keyframes flo2{to{transform:translate(-50px,40px) scale(1.1)}}
  @keyframes flo3{to{transform:translate(50px,-40px) scale(1.2)}}

  header,main,nav.tabbar{position:relative;z-index:1}
  header{flex:0 0 auto;display:flex;align-items:center;gap:11px;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;
    border-bottom:1px solid var(--border);background:rgba(8,8,12,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .logo{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:#fff;background:linear-gradient(140deg,var(--accent-2),var(--accent));box-shadow:0 6px 18px var(--accent-glow)}
  header b{font-family:'Poppins';font-weight:800;font-size:17px;letter-spacing:-.02em}
  header small{display:block;font-size:10px;color:var(--sub);font-weight:500}

  main{flex:1 1 auto;position:relative;overflow:hidden}
  .screen{position:absolute;inset:0;display:none;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .screen.active{display:flex;animation:scrIn .35s var(--ease)}
  @keyframes scrIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* tabbar */
  nav.tabbar{flex:0 0 auto;display:flex;border-top:1px solid var(--border);background:rgba(8,8,12,.85);backdrop-filter:blur(14px);
    padding-bottom:env(safe-area-inset-bottom)}
  .tabbtn{flex:1;border:none;background:none;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11px;font-weight:600;transition:.18s}
  .tabbtn svg{width:22px;height:22px}
  .tabbtn.on{color:var(--accent-2)}

  /* ===== ГАЙДЫ ===== */
  .pad{padding:18px}
  .gstage{background:var(--card);border:1px solid var(--border);border-radius:16px;margin-bottom:10px;overflow:hidden}
  .gstage-head{width:100%;text-align:left;border:none;background:none;color:var(--fg);padding:14px 15px;display:flex;align-items:center;gap:11px}
  .gnum{font-family:'Poppins';font-weight:800;font-size:13px;color:#fff;background:var(--accent);border-radius:8px;padding:3px 9px;flex:0 0 auto}
  .gstage-head .gt{flex:1;font-weight:700;font-size:15px}
  .gchev{color:var(--accent-2);transition:.2s;flex:0 0 auto}
  .gstage.open .gchev{transform:rotate(180deg)}
  .gbody{max-height:0;overflow:hidden;transition:max-height .3s var(--ease)}
  .gbody-in{padding:0 15px 15px}
  .gsub{font-size:13px;color:var(--sub);margin:0 0 12px}
  .say{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 12px 12px 0;padding:12px 14px;margin-bottom:9px;font-size:14px;font-weight:500}
  .say .when{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent-2);margin-bottom:5px}
  .tip{font-size:13px;color:var(--sub);font-style:italic;padding:2px 2px 10px}
  .tip::before{content:"→ ";font-style:normal;color:var(--accent-2);font-weight:700}
  .demo-bar{display:flex;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:14px;align-items:center}
  .demo-bar .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--sub);font-weight:700}
  .demo-bar b{flex:1;font-size:14px}
  .copy{border:none;background:var(--accent);color:#fff;border-radius:10px;padding:9px 14px;font-weight:700;font-size:13px}
  .copy.done{background:var(--like);color:#04130a}
  .ghead{font-family:'Poppins';font-weight:800;font-size:20px;margin:4px 0 4px}
  .gintro{font-size:13px;color:var(--sub);margin-bottom:16px}

  /* ===== СВАЙПЕР ===== */
  .deck-top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px}
  .deck-top .q{font-family:'Poppins';font-weight:700;font-size:16px}
  .deck-top .q small{display:block;font-size:12px;color:var(--sub);font-weight:500;font-family:'Inter'}
  .deck{position:relative;flex:1 1 auto;margin:8px 16px 0;min-height:400px}
  .swipe{position:absolute;inset:0;background:var(--card);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow);
    overflow:hidden;display:flex;flex-direction:column;will-change:transform;touch-action:none;user-select:none}
  .swipe.top-in{animation:cardIn .4s var(--ease)}
  @keyframes cardIn{from{opacity:.25}to{opacity:1}}
  .ph{position:relative;height:56%;flex:0 0 auto;background:#0b0d12 center/cover no-repeat}
  .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .ph .ph-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.9);background:linear-gradient(140deg,var(--accent),#0b0d12)}
  .ph .ph-fallback span{font-family:'Poppins';font-weight:800;font-size:60px}
  .ph-shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(2,2,3,.85))}
  .rate{position:absolute;top:12px;left:12px;z-index:2;display:flex;align-items:center;gap:5px;background:rgba(2,2,3,.6);backdrop-filter:blur(6px);border-radius:999px;padding:6px 11px;font-family:'Poppins';font-weight:700;font-size:13px}
  .rate svg{width:15px;height:15px;color:var(--star)}
  .rev{position:absolute;top:12px;right:12px;z-index:2;background:rgba(2,2,3,.6);backdrop-filter:blur(6px);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600;color:#fff}
  .swipe-body{flex:1;display:flex;flex-direction:column;padding:0 18px 16px;margin-top:-46px;position:relative;z-index:1}
  .swipe h3{font-family:'Poppins';font-size:23px;font-weight:800;letter-spacing:-.02em;line-height:1.12}
  .swipe .addr{font-size:13px;color:var(--sub);margin-top:5px;display:flex;align-items:center;gap:6px}
  .links{display:flex;gap:8px;margin-top:auto;padding-top:14px}
  .links a{flex:1;text-align:center;text-decoration:none;font-weight:700;font-size:13px;border:1px solid var(--border);border-radius:11px;padding:10px;color:var(--accent-2);background:var(--surface)}
  .drag-glow{position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:3;transition:box-shadow .15s ease}
  .stamp{position:absolute;top:22px;z-index:5;font-family:'Poppins';font-weight:800;font-size:26px;border:4px solid;border-radius:12px;padding:4px 12px;opacity:0;text-transform:uppercase}
  .stamp.like{left:18px;color:var(--like);border-color:var(--like);transform:rotate(-14deg)}
  .stamp.nope{right:18px;color:var(--nope);border-color:var(--nope);transform:rotate(14deg)}

  .actions{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:22px;padding:16px 0 calc(14px + env(safe-area-inset-bottom))}
  .act{width:60px;height:60px;border-radius:50%;border:1px solid var(--border);background:var(--card-2);display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.4);transition:.18s var(--ease)}
  .act:active{transform:scale(.9)}
  .act.no{color:var(--nope)}.act.yes{color:var(--like)}.act.info{color:var(--accent-2)}.act.sm{width:48px;height:48px}

  .state{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:14px}
  .state.show{display:flex}
  .state h3{font-size:19px;font-weight:800}.state p{color:var(--sub);font-size:14px;max-width:300px}
  .spinner{width:42px;height:42px;border:3px solid var(--surface-2);border-top-color:var(--accent-2);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .btn-line{border:1px solid var(--accent);color:var(--accent-2);background:var(--surface);font-family:'Poppins';font-weight:700;padding:11px 18px;border-radius:12px}

  /* ===== БАЗА ===== */
  .tabs2{display:flex;gap:8px;padding:14px 16px 4px}
  .stab{flex:1;border:1px solid var(--border);background:var(--surface);border-radius:11px;padding:10px;font-family:'Poppins';font-weight:700;font-size:13px;color:var(--sub);transition:.18s}
  .stab.on{background:linear-gradient(140deg,var(--accent-2),var(--accent));color:#fff;border-color:transparent;box-shadow:0 6px 16px var(--accent-glow)}
  .lead{display:flex;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:11px;margin:0 16px 10px}
  .lead .av{width:58px;height:58px;border-radius:12px;flex:0 0 auto;background:linear-gradient(140deg,var(--accent),#0b0d12) center/cover no-repeat;display:grid;place-items:center;color:#fff;font-family:'Poppins';font-weight:800;font-size:24px;overflow:hidden}
  .lead .av img{width:100%;height:100%;object-fit:cover}
  .lead .info{flex:1;min-width:0}
  .lead h4{font-family:'Poppins';font-size:15px;font-weight:700;letter-spacing:-.01em}
  .lead .sub2{font-size:12px;color:var(--sub);margin-top:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .lead .sub2 .st{color:var(--star);font-weight:700}
  .lead-act{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
  .lead-act a,.lead-act button{font-size:12px;font-weight:700;text-decoration:none;border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:7px 9px;color:var(--accent-2)}
  .lead-act .remind.on{background:var(--star);color:#1a1400;border-color:transparent}
  .lead-act .del{color:var(--nope);border:none;background:none;margin-left:auto;text-decoration:underline}
  .empty-s{text-align:center;color:var(--sub);padding:50px 22px;font-size:14px}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div id="aurora" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>

<header>
  <span class="logo" id="logo"></span>
  <div><b>Барбер-Лиды</b><small id="hi">Уфа · барбершопы</small></div>
</header>

<main>
  <!-- ГАЙДЫ -->
  <section class="screen active" id="s-guide">
    <div class="pad">
      <div class="ghead">Гайд по звонку</div>
      <div class="gintro">Цель звонка — назначить демо, а не продать. Жми этап, чтобы раскрыть скрипт.</div>
      <div class="demo-bar">
        <span class="lbl">Демо</span>
        <b id="demoText">@barbershops_demo_bot</b>
        <button class="copy" id="copyBtn" onclick="copyDemo()">Копировать</button>
      </div>
      <div id="guideList"></div>
    </div>
  </section>

  <!-- СВАЙПЕР -->
  <section class="screen" id="s-swipe">
    <div class="deck-top">
      <div class="q">Барбершопы Уфы<small id="deckSub">по рейтингу и отзывам</small></div>
    </div>
    <div class="deck" id="deck">
      <div class="state" id="st-loading"><div class="spinner"></div><p>Загружаю барбершопы…</p></div>
      <div class="state" id="st-error"><h3>Не загрузилось</h3><p id="errMsg"></p><button class="btn-line" onclick="loadShops()">Повторить</button></div>
      <div class="state" id="st-empty"><h3>Всё разобрано</h3><p>Карточки закончились. Загляни в «Базу» — там твои лайки.</p><button class="btn-line" onclick="go('base')">Моя база</button></div>
    </div>
    <div class="actions" id="deckActions">
      <button class="act no" onclick="swipeBtn(-1)" id="xBtn" aria-label="Скрыть"></button>
      <button class="act sm info" onclick="openMaps()" id="mapBtn" aria-label="2ГИС"></button>
      <button class="act yes" onclick="swipeBtn(1)" id="likeBtn" aria-label="В лайки"></button>
    </div>
  </section>

  <!-- БАЗА -->
  <section class="screen" id="s-base">
    <div class="tabs2">
      <button class="stab on" data-t="like" id="tabLike" onclick="setTab('like')">Лайки</button>
      <button class="stab" data-t="hidden" id="tabHidden" onclick="setTab('hidden')">Скрытые</button>
    </div>
    <div id="baseList" style="flex:1"></div>
  </section>
</main>

<nav class="tabbar">
  <button class="tabbtn on" id="nav-guide" onclick="go('guide')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5z"/><path d="M13 3v5h5"/></svg>
    <span>Гайды</span>
  </button>
  <button class="tabbtn" id="nav-swipe" onclick="go('swipe')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="14" height="16" rx="3"/><path d="M17 8l4 1.5v8L17 19"/></svg>
    <span>Поиск</span>
  </button>
  <button class="tabbtn" id="nav-base" onclick="go('base')">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.6-4.7-10-9.4C.5 8.3 2.4 5 6 5c2.1 0 3.3 1.1 4 2.3C10.7 6.1 11.9 5 14 5c3.6 0 5.5 3.3 4 6.6C19.6 16.3 12 21 12 21z"/></svg>
    <span>База <em id="baseCnt" style="font-style:normal;color:var(--like)"></em></span>
  </button>
</nav>

<script>
/* ===== Telegram ===== */
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if(tg){ tg.ready(); tg.expand(); try{tg.setHeaderColor('#020203');tg.setBackgroundColor('#020203')}catch(e){} }
function haptic(t){try{tg&&tg.HapticFeedback&&tg.HapticFeedback.impactOccurred(t||'light')}catch(e){}}
const INIT = tg ? tg.initData : '';                       // подпись для бэкенда
const UID  = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) ? String(tg.initDataUnsafe.user.id) : 'local';

const ICON={
  heart:'<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.6-4.7-10-9.4C.5 8.3 2.4 5 6 5c2.1 0 3.3 1.1 4 2.3C10.7 6.1 11.9 5 14 5c3.6 0 5.5 3.3 4 6.6C19.6 16.3 12 21 12 21z"/></svg>',
  x:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  map:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3 3 6v15l6-3 6 3 6-3V3l-6 3-6-3z"/><path d="M9 3v15M15 6v15"/></svg>',
  bolt:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3 6.5 7 .8-5.2 4.7L18 21l-6-3.4L6 21l1.2-7L2 9.3l7-.8L12 2z"/></svg>',
  pin:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-6 7-11a7 7 0 1 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',
};
document.getElementById('logo').innerHTML=ICON.bolt;
document.getElementById('xBtn').innerHTML=ICON.x;
document.getElementById('likeBtn').innerHTML=ICON.heart;
document.getElementById('mapBtn').innerHTML=ICON.map;

/* ===== Гайды (контент скрипта) ===== */
const STAGES=[
  {n:'00',t:'Перед звонком',sub:'1 минута подготовки. Ты не попрошайка — ты приносишь пользу.',
   blocks:[['','Открой карточку барбершопа — узнай <b>название</b> и, если повезёт, <b>имя владельца</b>.'],
           ['','Держи под рукой ссылку на демо-бота (кнопка сверху).'],
           ['','Говори спокойно и чуть медленнее, чем хочется.']],
   tip:'Звонить в будни, 12:00–16:00. Вечером и в выходные барберам не до этого.'},
  {n:'01',t:'Администратор',sub:'Не питчи админа — дойди до владельца или возьми его контакт.',
   blocks:[['Заход','Здравствуйте! [Название], верно? Подскажите, как зовут вашего руководителя — хочу коротко обсудить онлайн-запись, чтобы вам меньше звонков принимать. Он на месте?'],
           ['Если «по какому вопросу?»','Делаю для барбершопов запись через телеграм — клиенты сами выбирают время. Это решает владелец, поэтому хочу с ним пару минут. Как его зовут?'],
           ['Если «его нет / занят»','Понял. Когда удобнее перезвонить, чтобы застать [Имя]? Может, есть его прямой телефон или телеграм?']],
   tip:'Записал имя + время + контакт — это уже успех звонка.'},
  {n:'02',t:'Владелец — заход',sub:'15–20 секунд. Спроси разрешение — это снимает защиту.',
   blocks:[['','[Имя], здравствуйте! Меня зовут [Имя], я делаю для барбершопов телеграм-бота для записи: клиент сам выбирает мастера и время, а бот напоминает за день до визита. Удобно секунду рассказать или лучше перезвонить?']],
   tip:'Спросил разрешение — звучит уважительно, а не как впаривание.'},
  {n:'03',t:'Пара вопросов',sub:'Вовлечение. Его ответ — то, на что обопрёшься в питче.',
   blocks:[['','Подскажите, у вас запись сейчас как ведётся — директ, звонки, или какой-то сервис?'],
           ['','А с неявками сталкиваетесь? Когда записался и не пришёл?']],
   tip:'Молчи и слушай. Запомни его боль — про неё и будет питч.'},
  {n:'04',t:'Питч',sub:'Привязываешь к его боли из прошлого этапа.',
   blocks:[['','Клиенту приходит ссылка на ваш бот в телеге, он сам выбирает мастера и время — без звонков. За день бот напоминает, можно перенести в один клик. Меньше пустых окон от неявок, админ не висит на телефоне.']],
   tip:''},
  {n:'05',t:'Закрытие на демо',sub:'Не закрываешь сделку — закрываешь на «покажу».',
   blocks:[['','Давайте просто покажу — скину готового бота, потыкаете за пару минут, ни к чему не обязывает. Сегодня вечером или завтра удобнее?'],
           ['Или сразу','Скину прямо сейчас в телеграм — ваш номер этот же? Гляньте, я наберу завтра.']],
   tip:'Назначил демо — отметь барбершоп лайком, чтобы не потерять.'},
  {n:'!',t:'Возражения',sub:'Не воюй: давит сильно — иди к следующему.',
   blocks:[['«Уже есть YClients / DIKIDI»','Значит запись для вас важна. Моя — прямо в телеграме, где клиент и так сидит, без отдельного приложения. Покажу за 5 минут, сравните.'],
           ['«Сколько стоит?»','Настройка — 30, дальше небольшая сумма в месяц. Но давайте сначала покажу — может, вообще не подойдёт.'],
           ['«Пришлите в директ»','Скину пример в телеграм. И наберу завтра в это же время, чтобы не потерялось. Ок?'],
           ['«Сколько вам лет?»','Мне 17, но проще показать результат, чем рассказывать. Гляньте бота — он за меня говорит.'],
           ['«Не надо / не интересно»','Понял, не буду занимать время. Скину бота в телеграм — вдруг пригодится. Хорошего дня!']],
   tip:'3 «нет» из 5 звонков — норма для холода.'},
];
const gl=document.getElementById('guideList');
gl.innerHTML=STAGES.map((s,i)=>`
  <div class="gstage${i===0?' open':''}">
    <button class="gstage-head" onclick="this.parentNode.classList.toggle('open')">
      <span class="gnum">${s.n}</span><span class="gt">${s.t}</span>
      <span class="gchev"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></span>
    </button>
    <div class="gbody" style="${i===0?'max-height:1200px':''}">
      <div class="gbody-in">
        <p class="gsub">${s.sub}</p>
        ${s.blocks.map(b=>`<div class="say">${b[0]?`<span class="when">${b[0]}</span>`:''}${b[1]}</div>`).join('')}
        ${s.tip?`<p class="tip">${s.tip}</p>`:''}
      </div>
    </div>
  </div>`).join('');
document.querySelectorAll('.gstage-head').forEach(h=>h.addEventListener('click',()=>{
  const body=h.nextElementSibling;
  body.style.maxHeight=h.parentNode.classList.contains('open')?body.scrollHeight+'px':'0';
}));
function copyDemo(){
  const t=document.getElementById('demoText').textContent,b=document.getElementById('copyBtn');
  const done=()=>{b.textContent='Скопировано ✓';b.classList.add('done');haptic('light');setTimeout(()=>{b.textContent='Копировать';b.classList.remove('done')},1500)};
  if(navigator.clipboard)navigator.clipboard.writeText(t).then(done).catch(done);else done();
}

/* ===== навигация ===== */
function go(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id==='s-'+name));
  document.querySelectorAll('.tabbtn').forEach(b=>b.classList.toggle('on',b.id==='nav-'+name));
  haptic('light');
  if(name==='base')renderBase();
  if(name==='swipe'&&!shops.length&&!loading)loadShops();
}

/* ===== база (лайки/дизы) ===== */
let liked=[], hidden=[], seen=[];
let baseTab='like', loading=false;
try{liked=JSON.parse(localStorage.getItem('bl_liked')||'[]')}catch(e){}
try{hidden=JSON.parse(localStorage.getItem('bl_hidden')||'[]')}catch(e){}
try{seen=JSON.parse(localStorage.getItem('bl_seen')||'[]')}catch(e){}
function saveLocal(){try{localStorage.setItem('bl_liked',JSON.stringify(liked));localStorage.setItem('bl_hidden',JSON.stringify(hidden));localStorage.setItem('bl_seen',JSON.stringify(seen))}catch(e){}}
let pushT=null;
function persist(){saveLocal();updateCnt();if(INIT){clearTimeout(pushT);pushT=setTimeout(pushBase,700)}}
function updateCnt(){document.getElementById('baseCnt').textContent=liked.length?liked.length:''}

async function pullBase(){
  if(!INIT)return;
  try{
    const r=await fetch('/api/base',{headers:{'X-Init-Data':INIT}});
    if(!r.ok)return;
    const d=await r.json();
    if(d&&Array.isArray(d.liked)){liked=d.liked;hidden=d.hidden||[];seen=d.seen||[];saveLocal();updateCnt();renderBase()}
  }catch(e){}
}
async function pushBase(){
  if(!INIT)return;
  try{await fetch('/api/base',{method:'PUT',headers:{'Content-Type':'application/json','X-Init-Data':INIT},body:JSON.stringify({liked,hidden,seen})})}catch(e){}
}

/* ===== свайпер ===== */
const SAMPLE=[
  {id:'s1',name:'OldBoy Barbershop',rating:4.9,reviews:512,address:'ул. Ленина, 28',photo:'',lat:54.7261,lon:55.9475},
  {id:'s2',name:'TOPGUN',rating:4.8,reviews:430,address:'пр. Октября, 34',photo:'',lat:54.7388,lon:55.9721},
  {id:'s3',name:'Britva',rating:4.7,reviews:318,address:'ул. Зорге, 9',photo:'',lat:54.7449,lon:55.9387},
  {id:'s4',name:'Чёрный Кот',rating:4.6,reviews:204,address:'ул. Менделеева, 137',photo:'',lat:54.7501,lon:55.9602},
  {id:'s5',name:'BORODACH',rating:4.5,reviews:176,address:'ул. Софьи Перовской, 50',photo:'',lat:54.7220,lon:55.9450},
];
let shops=[], deck=[], top=0;

async function loadShops(){
  loading=true;setState('st-loading');
  document.getElementById('deckActions').style.visibility='hidden';
  try{
    let list=[];
    try{
      const r=await fetch('/api/shops',{headers:INIT?{'X-Init-Data':INIT}:{}});
      if(r.ok){const d=await r.json();if(Array.isArray(d.shops))list=d.shops}
    }catch(e){}
    if(!list.length)list=SAMPLE.slice();        // оффлайн / до подключения 2ГИС
    const used=new Set([...liked.map(x=>x.id),...hidden.map(x=>x.id),...seen]);
    shops=list.filter(s=>!used.has(s.id));
    if(!shops.length){setState('st-empty');loading=false;return}
    deck=shops;top=0;setState(null);
    document.getElementById('deckActions').style.visibility='visible';
    renderDeck();
  }catch(err){document.getElementById('errMsg').textContent='Не удалось получить барбершопы.';setState('st-error')}
  loading=false;
}
function setState(id){['st-loading','st-error','st-empty'].forEach(s=>document.getElementById(s).classList.toggle('show',s===id))}

function renderDeck(){
  const wrap=document.getElementById('deck');
  wrap.querySelectorAll('.swipe').forEach(n=>n.remove());
  if(top>=deck.length){document.getElementById('deckActions').style.visibility='hidden';setState('st-empty');return}
  const view=deck.slice(top,top+3);
  for(let i=view.length-1;i>=0;i--){
    const card=buildCard(view[i]);const depth=i;
    card.style.transform=`translateY(${depth*10}px) scale(${1-depth*0.04})`;
    card.style.zIndex=String(10-depth);card.style.opacity=depth>1?'0':'1';
    if(i===0)card.classList.add('top-in');
    wrap.appendChild(card);
    if(i===0)attachDrag(card,view[i]);
  }
}
function buildCard(b){
  const c=document.createElement('div');c.className='swipe';
  const initial=escapeH((b.name.trim()[0]||'?').toUpperCase());
  const photo = b.photo
    ? `<img src="${escapeH(b.photo)}" alt="" onerror="this.style.display='none'">`
    : `<div class="ph-fallback"><span>${initial}</span></div>`;
  c.innerHTML=`
    <div class="ph">
      ${photo}
      <span class="rate">${ICON.star}${(b.rating||0).toFixed(1)}</span>
      <span class="rev">${fmtRev(b.reviews)} отзывов</span>
      <div class="ph-shade"></div>
    </div>
    <div class="swipe-body">
      <h3>${escapeH(b.name)}</h3>
      <div class="addr">${ICON.pin}${escapeH(b.address||'Уфа')}</div>
      <div class="links">
        <a href="https://2gis.ru/ufa/search/${encodeURIComponent(b.name)}" target="_blank" rel="noopener">2ГИС</a>
        <a href="https://yandex.ru/maps/?text=${encodeURIComponent(b.name+' Уфа')}" target="_blank" rel="noopener">Яндекс</a>
        ${b.phone?`<a href="tel:${b.phone.replace(/[^\d+]/g,'')}">Позвонить</a>`:''}
      </div>
    </div>
    <div class="drag-glow"></div>
    <div class="stamp like">В лайки</div>
    <div class="stamp nope">Скрыть</div>`;
  return c;
}
function attachDrag(card,b){
  let sx=0,dx=0,dy=0,drag=false;
  const like=card.querySelector('.stamp.like'),nope=card.querySelector('.stamp.nope'),glow=card.querySelector('.drag-glow');
  card.addEventListener('pointerdown',e=>{drag=true;sx=e.clientX;card.style.transition='none';card.classList.remove('top-in');try{card.setPointerCapture(e.pointerId)}catch(_){}});
  card.addEventListener('pointermove',e=>{if(!drag)return;dx=e.clientX-sx;
    card.style.transform=`translate(${dx}px,${e.clientY?0:0}px) rotate(${dx/16}deg)`;
    const k=Math.max(0,Math.min(1,Math.abs(dx)/90));
    like.style.opacity=dx>0?k:0;nope.style.opacity=dx<0?k:0;
    glow.style.boxShadow=dx>4?`inset 0 -120px 80px -40px rgba(43,213,118,${.25+k*.4})`:dx<-4?`inset 0 -120px 80px -40px rgba(255,92,122,${.25+k*.4})`:'none';
  });
  const up=()=>{if(!drag)return;drag=false;card.style.transition='transform .3s var(--ease), opacity .3s ease';
    if(dx>100)return fling(card,1,b);if(dx<-100)return fling(card,-1,b);
    card.style.transform='';like.style.opacity=0;nope.style.opacity=0;glow.style.boxShadow='none'};
  card.addEventListener('pointerup',up);card.addEventListener('pointercancel',up);
}
function fling(card,dir,b){card.style.transform=`translate(${dir*620}px,40px) rotate(${dir*26}deg)`;card.style.opacity='0';decide(b,dir>0);setTimeout(renderDeck,240)}
function decide(b,isLike){
  haptic(isLike?'medium':'light');
  if(isLike){if(!liked.find(x=>x.id===b.id))liked.unshift(Object.assign({remind:false},b))}
  else{if(!hidden.find(x=>x.id===b.id))hidden.unshift(b)}
  if(!seen.includes(b.id))seen.push(b.id);
  top++;persist();
}
function swipeBtn(dir){const card=document.querySelector('#deck .swipe:last-child');if(!card||top>=deck.length)return;card.style.transition='transform .3s var(--ease), opacity .3s ease';fling(card,dir,deck[top])}
function openMaps(){if(top>=deck.length)return;const b=deck[top];const u=`https://2gis.ru/ufa/search/${encodeURIComponent(b.name)}`;tg&&tg.openLink?tg.openLink(u):window.open(u,'_blank')}

/* ===== рендер базы ===== */
function setTab(t){baseTab=t;renderBase()}
function renderBase(){
  document.getElementById('tabLike').textContent='Лайки ('+liked.length+')';
  document.getElementById('tabHidden').textContent='Скрытые ('+hidden.length+')';
  document.querySelectorAll('.stab').forEach(x=>x.classList.toggle('on',x.dataset.t===baseTab));
  const el=document.getElementById('baseList');
  const list=baseTab==='like'?liked:hidden;
  if(!list.length){el.innerHTML='<div class="empty-s">'+(baseTab==='like'?'Свайпай барбершопы вправо — лайки появятся здесь.':'Свайпнутые влево попадают сюда и больше не показываются. Можно вернуть.')+'</div>';return}
  el.innerHTML=list.map(b=>{
    const av=b.photo?`<img src="${escapeH(b.photo)}" alt="" onerror="this.replaceWith(document.createTextNode('${escapeH((b.name[0]||'?').toUpperCase())}'))">`:escapeH((b.name.trim()[0]||'?').toUpperCase());
    return `<div class="lead">
      <div class="av">${av}</div>
      <div class="info">
        <h4>${escapeH(b.name)}</h4>
        <div class="sub2"><span class="st">${ICON.star}${(b.rating||0).toFixed(1)}</span><span>${fmtRev(b.reviews)} отзывов</span><span>${escapeH(b.address||'')}</span></div>
        <div class="lead-act">
          <a href="https://2gis.ru/ufa/search/${encodeURIComponent(b.name)}" target="_blank" rel="noopener">2ГИС</a>
          ${b.phone?`<a href="tel:${b.phone.replace(/[^\d+]/g,'')}">Звонок</a>`:''}
          ${baseTab==='like'
            ? `<button class="remind ${b.remind?'on':''}" onclick="toggleRemind('${b.id}')">${b.remind?'Напомню ✓':'Напомнить'}</button><button class="del" onclick="unlike('${b.id}')">убрать</button>`
            : `<button class="del" onclick="restore('${b.id}')">вернуть</button>`}
        </div>
      </div>
    </div>`;
  }).join('');
}
function toggleRemind(id){const x=liked.find(l=>l.id===id);if(x){x.remind=!x.remind;haptic('light');persist();renderBase()}}
function unlike(id){liked=liked.filter(x=>x.id!==id);persist();renderBase()}
function restore(id){hidden=hidden.filter(x=>x.id!==id);seen=seen.filter(s=>s!==id);persist();renderBase()}

/* ===== утилиты ===== */
function escapeH(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtRev(n){n=n||0;return n>=1000?(n/1000).toFixed(1).replace('.0','')+'k':n}

updateCnt();
pullBase();
</script>

</html>
